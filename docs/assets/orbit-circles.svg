<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" fill="none">
  <defs>
    <linearGradient id="ringG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="ringG2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.08" />
    </linearGradient>
  </defs>

  <!-- Outer dashed track -->
  <circle cx="350" cy="350" r="320" stroke="url(#ringG1)" stroke-width="1.5" stroke-dasharray="10 14" opacity="0.6" />
  
  <!-- Mid track with nodes -->
  <circle cx="350" cy="350" r="260" stroke="url(#ringG2)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.75" />
  <circle cx="610" cy="350" r="5" fill="#38bdf8" opacity="0.8" />
  <circle cx="90" cy="350" r="4" fill="#818cf8" opacity="0.8" />
  <circle cx="350" cy="90" r="6" fill="#fbbf24" opacity="0.8" />

  <!-- Inner smooth track -->
  <circle cx="350" cy="350" r="195" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5" />
  <circle cx="350" cy="350" r="140" stroke="#818cf8" stroke-width="1.2" opacity="0.4" />
</svg>
