<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="talonG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="clawG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="beamG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Group -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#logoBg)" stroke="#334155" stroke-width="1.5" />
    <!-- Glowing download arrow beam -->
    <path d="M32 14 L32 40" stroke="url(#beamG)" stroke-width="3.5" stroke-linecap="round" filter="url(#logoGlow)" />
    <path d="M24 32 L32 41 L40 32" fill="none" stroke="url(#beamG)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)" />
    <!-- Talons Claws -->
    <path d="M15 26 C17 32, 21 39, 27 42 C25 38, 24 32, 21 26 Z" fill="url(#talonG)" />
    <path d="M27 42 C26 40, 24 38, 23 36" stroke="url(#clawG)" stroke-width="1.2" stroke-linecap="round" />
    <path d="M49 26 C47 32, 43 39, 37 42 C39 38, 40 32, 43 26 Z" fill="url(#talonG)" />
    <path d="M37 42 C38 40, 40 38, 41 36" stroke="url(#clawG)" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="32" cy="48" r="4.5" fill="#38bdf8" filter="url(#logoGlow)" />
    <circle cx="32" cy="48" r="2" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="86" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">Talons</text>
  <text x="86" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#0284c7">FOR GRABBIT</text>
</svg>
