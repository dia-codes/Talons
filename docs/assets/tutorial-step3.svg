<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" fill="none">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect x="20" y="20" width="560" height="300" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)" />
  
  <!-- Window Titlebar -->
  <path d="M20 32 Q20 20 32 20 L568 20 Q580 20 580 32 L580 60 L20 60 Z" fill="#1e293b" />
  <circle cx="44" cy="40" r="6" fill="#ef4444" />
  <circle cx="64" cy="40" r="6" fill="#f59e0b" />
  <circle cx="84" cy="40" r="6" fill="#10b981" />
  <text x="300" y="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Grabbit — Active Stream Downloads</text>

  <!-- Notification Banner -->
  <rect x="40" y="75" width="520" height="42" rx="8" fill="#065f46" fill-opacity="0.3" stroke="#059669" stroke-width="1" />
  <circle cx="65" cy="96" r="10" fill="#10b981" />
  <path d="M60 96 L63 99 L70 92" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="86" y="100" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0">Talons v1.0.0 is active: Stream extractor hooked for YouTube &amp; 2000+ sites</text>

  <!-- Download Task 1: 4K Video Stream -->
  <rect x="40" y="130" width="520" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  
  <!-- Thumbnail badge -->
  <rect x="55" y="142" width="80" height="56" rx="6" fill="#0b1120" />
  <rect x="62" y="148" width="28" height="14" rx="3" fill="#ef4444" />
  <text x="76" y="158" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" fill="#ffffff">4K</text>
  <path d="M90 170 L102 177 L90 184 Z" fill="#38bdf8" />

  <text x="150" y="158" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Nature Documentary (2160p 60fps HDR)</text>
  <text x="150" y="174" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Streams matched: MP4 (H.265 / AAC) • 74.8 MB/s • ETA: 12s</text>
  
  <!-- Progress Bar -->
  <rect x="150" y="185" width="320" height="6" rx="3" fill="#334155" />
  <rect x="150" y="185" width="265" height="6" rx="3" fill="url(#progGrad)" />
  <text x="480" y="191" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">84%</text>

  <!-- Download Task 2: High Bitrate Audio Stream -->
  <rect x="40" y="220" width="520" height="80" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  
  <rect x="55" y="232" width="80" height="56" rx="6" fill="#0b1120" />
  <rect x="62" y="238" width="34" height="14" rx="3" fill="#8b5cf6" />
  <text x="79" y="248" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" fill="#ffffff">AUDIO</text>
  <circle cx="95" cy="265" r="10" fill="#6366f1" fill-opacity="0.3" />
  <path d="M92 262 L92 268 M98 259 L98 271 M95 260 L95 270" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />

  <text x="150" y="248" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Studio Master Live Session (320kbps Lossless AAC)</text>
  <text x="150" y="264" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Stream audio extracted • 14.2 MB • Completed</text>
  
  <!-- Completed badge -->
  <rect x="475" y="242" width="68" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="509" y="258" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">READY</text>
</svg>
