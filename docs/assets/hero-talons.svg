<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" width="540" height="540" fill="none">
  <defs>
    <!-- Background glow & shield -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="talonGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="clawEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>
    <filter id="bigGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="laserGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Light Core -->
  <circle cx="270" cy="270" r="250" fill="url(#heroGlow)" />

  <!-- Outer Rounded Super-ellipse Plaque -->
  <rect x="70" y="70" width="400" height="400" rx="96" fill="url(#shieldGrad)" stroke="url(#shieldBorder)" stroke-width="3.5" filter="url(#bigGlow)" />

  <!-- Inner Subtle Grid Lines -->
  <line x1="120" y1="270" x2="420" y2="270" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" />
  <line x1="270" y1="120" x2="270" y2="420" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Laser Stream Beam -->
  <path d="M270 120 L270 300" stroke="url(#laserBeam)" stroke-width="16" stroke-linecap="round" filter="url(#laserGlow)" />
  <path d="M220 250 L270 310 L320 250" fill="none" stroke="url(#laserBeam)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#laserGlow)" />

  <!-- Inner Core Arrow White Accent -->
  <path d="M270 125 L270 295" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <path d="M228 253 L270 305 L312 253" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Talons / Claws (Fierce Predator Eagle Grasp) -->
  <!-- Outer Left Talon -->
  <path d="M140 210 C160 260, 190 320, 240 345 C225 310, 215 260, 190 205 Z" fill="url(#talonGradHero)" />
  <path d="M240 345 C230 330, 218 310, 215 290" stroke="url(#clawEdge)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Inner Left Talon -->
  <path d="M195 190 C215 250, 245 305, 268 330 C255 295, 245 250, 228 190 Z" fill="url(#talonGradHero)" />
  <path d="M268 330 C260 315, 252 298, 248 280" stroke="url(#clawEdge)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Inner Right Talon -->
  <path d="M345 190 C325 250, 295 305, 272 330 C285 295, 295 250, 312 190 Z" fill="url(#talonGradHero)" />
  <path d="M272 330 C280 315, 288 298, 292 280" stroke="url(#clawEdge)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Outer Right Talon -->
  <path d="M400 210 C380 260, 350 320, 300 345 C315 310, 325 260, 350 205 Z" fill="url(#talonGradHero)" />
  <path d="M300 345 C310 330, 322 310, 325 290" stroke="url(#clawEdge)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Energy Power Orb at Nexus -->
  <circle cx="270" cy="375" r="26" fill="#38bdf8" filter="url(#laserGlow)" />
  <circle cx="270" cy="375" r="14" fill="#67e8f9" />
  <circle cx="270" cy="375" r="7" fill="#ffffff" />

  <!-- Badge / Floating Tag: macOS Silicon -->
  <g transform="translate(160, 425)">
    <rect width="220" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="22" cy="19" r="6" fill="#22c55e" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc" letter-spacing="0.5">APPLE SILICON NATIVE</text>
  </g>
</svg>
